[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "StringUtils-darhkharo"
version = "0.0.1"
authors = [
  { name="QKid", email="quantumwizard104@gmail.com" },
]
description = "A String utils package"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/quantumdarsh-oss/StringUtils"
Issues = "https://github.com/quantumdarsh-oss/StringUtils/issues"